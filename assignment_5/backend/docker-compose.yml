version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cipher-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cipher
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
